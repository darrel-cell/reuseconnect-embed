name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # NOT `tsc --noEmit`. tsconfig.json here is solution-style ("files": [] plus
      # project references), so the bare command compiles nothing and exits 0 —
      # a gate that always passes. The script targets tsconfig.app.json.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: ignore

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds and serves dist, then drives it with the API mocked from
      # fixtures — no database or backend needed. These exist because a
      # rendering bug once shipped with a clean typecheck and a green API suite.
      - name: Browser tests
        run: npm run test:browser

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # A real gate: the 111-error backlog is cleared. Warnings are still
    # reported but do not fail the build — the remaining exhaustive-deps ones
    # need per-hook judgement, and blanket-adding deps risks render loops.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
